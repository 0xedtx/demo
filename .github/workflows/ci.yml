name: CI

# Roda em todo Pull Request para a main e também é reaproveitado pelo deploy (workflow_call).
# Node 24 e Python 3.12 são as mesmas versões instaladas nos containers das squads.
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  web:
    name: web (Next)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  api:
    name: api (Nest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  data:
    name: data (FastAPI)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: data } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
