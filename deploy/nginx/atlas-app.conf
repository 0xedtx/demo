# Site do nginx DENTRO do container da squad (porta 80). O Cloudflare cuida do HTTPS e entrega
# o tráfego aqui pelo túnel, então não há certificado nem certbot neste servidor.
# Instalado pelo deploy/remote-deploy.sh, que substitui o site de boas-vindas deste domínio
# (com backup e volta automática se o `nginx -t` falhar).

# Os mapas ficam no contexto http, fora de server, e só podem aparecer uma vez por squad.
map $http_upgrade $valley_atlas_demo_connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserva o protocolo informado pelo Cloudflare. Sem valor válido, usa o da conexão.
map $http_x_forwarded_proto $valley_atlas_demo_forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen 80;
    server_name demo.amontadavalley.com.br;

    # Mantém as páginas de erro do ambiente Valley.
    include /etc/nginx/snippets/valley-errors.conf;

    # /api/...  ->  Nest (porta 3001). O caminho segue completo, com o /api na frente.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $valley_atlas_demo_forwarded_proto;
    }

    # todo o resto  ->  Next (porta 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $valley_atlas_demo_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $valley_atlas_demo_connection_upgrade;
    }

    # O serviço de dados (porta 8000) NÃO aparece aqui de propósito: só a API conversa com ele.
}
